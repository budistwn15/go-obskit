name: go-test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - adapters/nethttp
          - adapters/ginx
          - adapters/fiberx
          - adapters/gormx
          - adapters/grpcx
          - adapters/otel
          - examples
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  race:
    name: Race (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - adapters/nethttp
          - adapters/ginx
          - adapters/fiberx
          - adapters/gormx
          - adapters/grpcx
          - adapters/otel
          - examples
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Run race tests
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  soak-smoke:
    name: Soak smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run bounded overload soak
        env:
          OBSKIT_SOAK_DURATION: 5s
        run: go test -run '^TestSoak(Stdout|DirectHTTP)$' -timeout 30s .
